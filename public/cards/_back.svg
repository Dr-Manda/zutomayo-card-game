<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="234" height="328" viewBox="0 0 234 328">
  <defs>
    <radialGradient id="halftone" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#F15060" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#F15060" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#F15060" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#F15060"/>
    </pattern>
    <mask id="dotMask">
      <rect width="234" height="328" fill="url(#halftone)"/>
    </mask>
  </defs>

  <!-- Warm paper background -->
  <rect width="234" height="328" fill="#E7E0D0"/>

  <!-- Halftone pink dot field, masked by radial gradient -->
  <rect width="234" height="328" fill="url(#dots)" mask="url(#dotMask)"/>

  <!-- Inner frame: 2px black, inset 8px -->
  <rect x="9" y="9" width="216" height="310" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Center kanji/hiragana title -->
  <text x="117" y="175"
        text-anchor="middle"
        font-family="'Yu Mincho', 'YuMincho', 'Hiragino Mincho Pro', 'MS Mincho', serif"
        font-size="44"
        font-weight="700"
        fill="#1a1a1a"
        letter-spacing="2">ずとまよ</text>

  <!-- Bottom mono caption -->
  <text x="117" y="305"
        text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="8"
        fill="#1a1a1a"
        letter-spacing="1.5">ZUTOMAYO CARD GAME</text>
</svg>
